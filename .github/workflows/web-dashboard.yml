name: Workbench (web app)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # The main CI runs SigProfilerExtractor's unittest suite, which does not
  # look inside tests/web. This job runs the Workbench's pytest suite,
  # including the Playwright browser tests with a real Chromium.
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the package with test extras and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install ".[web-tests]"
          python -m playwright install --with-deps chromium

      - name: Web server, runner and browser tests
        run: pytest tests/web -v -rs

  launcher-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The python3 that comes with macOS is 3.9, which the Workbench cannot
      # use (reportlab 5.1 refuses to import there).
      - name: With only the Python that comes with macOS, the launcher says what to install
        timeout-minutes: 5
        run: |
          /usr/bin/python3 --version
          set +e
          PATH=/usr/bin:/bin:/usr/sbin:/sbin bash ./launch_web.sh --no-launch > old-python.log 2>&1
          code=$?
          set -e
          cat old-python.log
          test "$code" -eq 1
          grep -q "needs Python 3.10 or newer" old-python.log
          grep -q "comes with macOS" old-python.log
          test ! -d .venv-dashboard

      - name: Leave an environment made with that Python, to be set up again
        run: /usr/bin/python3 -m venv .venv-dashboard

      - name: First launch installs dependencies
        run: |
          chmod +x launch_web.sh
          ./launch_web.sh --no-launch > first-run.log 2>&1 &
          LAUNCH_PID=$!
          for i in $(seq 1 300); do
            grep -q "Workbench running at" first-run.log && break
            sleep 2
          done
          grep -q "Workbench running at" first-run.log || (cat first-run.log; exit 1)
          cat first-run.log
          grep -q "made with Python 3.9.*setting it up again" first-run.log
          ./launch_web.sh --stop
          wait $LAUNCH_PID || true

      - name: Second launch installs nothing
        run: |
          ./launch_web.sh --no-launch > second-run.log 2>&1 &
          LAUNCH_PID=$!
          for i in $(seq 1 300); do
            grep -q "Workbench running at" second-run.log && break
            sleep 2
          done
          grep -q "Workbench running at" second-run.log || (cat second-run.log; exit 1)
          cat second-run.log
          grep -q "Dependencies already installed; skipping install." second-run.log
          ./launch_web.sh --stop
          wait $LAUNCH_PID || true

      - name: The clickable uninstaller removes the environment
        run: |
          sleep 3
          ./uninstall_web.sh --yes
          test ! -d .venv-dashboard

  launcher-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Python 3.9 cannot run the Workbench (reportlab 5.1 refuses to import
      # there). Installed beside 3.12 without going on PATH.
      - name: Set up Python 3.9
        id: py39
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          update-environment: false

      - name: With only Python 3.9, the launcher says what to install
        shell: cmd
        timeout-minutes: 5
        run: |
          for %%F in ("${{ steps.py39.outputs.python-path }}") do set "PY39_DIR=%%~dpF"
          set "PATH=%PY39_DIR%;%SystemRoot%\System32"
          where py >nul 2>nul && (echo py is still on PATH, so Python 3.9 is not the only Python & exit /b 1)
          python --version
          call launch_web.bat --no-launch > old-python.log 2>&1
          set CODE=%ERRORLEVEL%
          type old-python.log
          if not "%CODE%"=="1" exit /b 1
          findstr /C:"needs Python 3.10 or newer" old-python.log >nul || exit /b 1
          findstr /C:"version 3.9" old-python.log >nul || exit /b 1
          if exist .venv-dashboard exit /b 1

      - name: Leave an environment made with Python 3.9, to be set up again
        shell: cmd
        run: '"${{ steps.py39.outputs.python-path }}" -m venv .venv-dashboard'

      - name: First launch installs dependencies
        shell: cmd
        run: |
          start /B cmd /C "launch_web.bat --no-launch > first-run.log 2>&1"
          for /L %%i in (1,1,300) do (
            findstr /C:"Workbench running at" first-run.log >nul 2>nul && goto :first_up
            ping -n 3 127.0.0.1 >nul
          )
          :first_up
          type first-run.log
          findstr /C:"Workbench running at" first-run.log >nul || exit /b 1
          findstr /C:"setting it up again" first-run.log >nul || exit /b 1
          launch_web.bat --stop

      - name: Second launch installs nothing
        shell: cmd
        run: |
          start /B cmd /C "launch_web.bat --no-launch > second-run.log 2>&1"
          for /L %%i in (1,1,300) do (
            findstr /C:"Workbench running at" second-run.log >nul 2>nul && goto :second_up
            ping -n 3 127.0.0.1 >nul
          )
          :second_up
          type second-run.log
          findstr /C:"Workbench running at" second-run.log >nul || exit /b 1
          findstr /C:"Dependencies already installed; skipping install." second-run.log >nul || exit /b 1
          launch_web.bat --stop

      # On Windows, os.kill(pid, 0) sends Ctrl+C to the whole console instead
      # of checking the pid; these tests fail if any process check does that.
      - name: Checking on processes sends no Ctrl+C
        shell: cmd
        run: |
          .venv-dashboard\Scripts\python.exe -m pip install --quiet pytest
          .venv-dashboard\Scripts\python.exe -m pytest tests\web\test_process_liveness.py -v -p no:cacheprovider

      - name: The clickable uninstaller removes the environment
        shell: cmd
        run: |
          ping -n 6 127.0.0.1 >nul
          call uninstall_web.bat --yes
          if exist .venv-dashboard exit /b 1
